name: Publish GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      expectedCommit:
        description: Full commit SHA expected from this workflow trigger
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedCommit || github.sha }}

      - name: Verify trigger and checkout identity
        env:
          EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedCommit || github.sha }}
        run: node scripts/verify-release-identity.mjs

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build immutable release
        run: npm run release:build

      - name: Read release version
        shell: bash
        run: |
          PAGES_VERSION=$(node -p "require('./package.json').version")
          echo "PAGES_VERSION=$PAGES_VERSION" >> "$GITHUB_ENV"

      - name: Upload commit-bound release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uxuv-pages-${{ env.PAGES_VERSION }}-${{ github.sha }}
          path: release/${{ env.PAGES_VERSION }}
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: true

      - name: Check out published releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          path: published

      - name: Publish immutable release
        shell: bash
        run: |
          set -euo pipefail
          source="release/$PAGES_VERSION"
          target="published/$PAGES_VERSION"

          if [ -e "$target" ]; then
            diff --recursive --brief "$source" "$target"
          else
            cp -R "$source" "$target"
          fi

          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=./'$PAGES_VERSION'/">' \
            '<title>UXUV-Pages</title>' \
            '<a href="./'$PAGES_VERSION'/">Open UXUV-Pages '$PAGES_VERSION'</a>' \
            > published/index.html
          touch published/.nojekyll

          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy: 发布 Pages $PAGES_VERSION"
          git push origin gh-pages
