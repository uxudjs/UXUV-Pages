name: Publish GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: uxuv-pages-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Build current release
        run: npm run release:build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Read release version
        shell: bash
        run: |
          PAGES_VERSION=$(node -p "require('./package.json').version")
          echo "PAGES_VERSION=$PAGES_VERSION" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uxuv-pages-${{ env.PAGES_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/current
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: true

      - name: Check out published site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          path: published

      - name: Publish guidance and the stable Worker asset root
        shell: bash
        run: |
          set -euo pipefail
          source="release/current"
          staging="$(mktemp -d)"
          mkdir -p "$staging/app"
          rsync --archive "$source/" "$staging/app/"
          cp public/github-pages.html "$staging/index.html"
          cp public/github-pages.html "$staging/404.html"
          touch "$staging/.nojekyll"
          rsync --archive --delete --exclude='.git/' "$staging/" published/

          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy: 发布 Pages $PAGES_VERSION"
          git push origin gh-pages
